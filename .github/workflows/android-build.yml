
name: Country Battle Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: country-battle-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_MOBILE_VERSION: '18.20.4'
  ANDROID_NDK_VERSION: '27.2.12479018'
  GRADLE_VERSION: '8.9'

jobs:
  build-debug-apk:
    name: Extract ZIP and Build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Get repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Automatically extract project ZIP
      - name: Extract Android Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$(find . -maxdepth 1 -type f \
            -iname '*.zip' -print -quit)"

          if [[ -z "$ARCHIVE" ]]; then
            echo "ERROR: Android project ZIP not found!"
            exit 1
          fi

          echo "Found project: $ARCHIVE"

          mkdir -p "$GITHUB_WORKSPACE/_project"

          unzip -q "$ARCHIVE" -d "$GITHUB_WORKSPACE/_project"

          SETTINGS="$(find "$GITHUB_WORKSPACE/_project" \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [[ -z "$SETTINGS" ]]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/scripts/setup-node-mobile.sh"
          test -f "$PROJECT_DIR/scripts/setup-node-deps.sh"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "Project extraction successful!"

      # 3. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Android SDK tools
      - name: Setup Android SDK Manually
  shell: bash
  run: |
    set -euo pipefail

    echo "Android SDK: $ANDROID_HOME"

    SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
      -type f -name sdkmanager -print -quit)"

    if [[ -z "$SDKMANAGER" ]]; then
      echo "ERROR: SDK Manager not found!"
      exit 1
    fi

    echo "Using: $SDKMANAGER"

    set +o pipefail
    yes | "$SDKMANAGER" --licenses || true
    set -o pipefail

    "$SDKMANAGER" \
      "platform-tools" \
      "platforms;android-35" \
      "build-tools;35.0.0" \
      "ndk;27.2.12479018" \
      "cmake;3.22.1"

    echo "Android SDK setup completed!"

      # 5. Accept licenses and install SDK packages
      - name: Accept Android Licenses and Install SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

      # 6. Export NDK path
      - name: Configure Android NDK
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            >> "$GITHUB_ENV"

      # 7. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 8. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 9. Download ARM64 Node.js Mobile
      - name: Setup Node.js Mobile ARM64 Runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          bash scripts/setup-node-mobile.sh

      # 10. Install Node dependencies
      - name: Install Node.js Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          bash scripts/setup-node-deps.sh

      # 11. Validate JavaScript
      - name: Validate JavaScript
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          node --check \
            app/src/main/assets/nodejs-project/bootstrap.js

          node --check \
            app/src/main/assets/nodejs-project/server.js

          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path(
              'app/src/main/assets/nodejs-project/game/index.html'
          ).read_text(encoding='utf-8')

          scripts = re.findall(
              r'<script\b[^>]*>(.*?)</script>',
              html,
              re.S | re.I
          )

          Path('/tmp/country-battle-game.js').write_text(
              '\n'.join(scripts),
              encoding='utf-8'
          )
          PY

          node --check /tmp/country-battle-game.js

          echo "JavaScript validation successful!"

      # 12. Validate ARM64 libraries
      - name: Validate ARM64 Runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          LIB="app/libnode/bin/arm64-v8a/libnode.so"

          test -s "$LIB"
          test -s app/libnode/include/node/node.h

          file "$LIB"

          readelf -h "$LIB" | grep -E 'Machine:.*AArch64'

          echo "ARM64 runtime verified!"

      # 13. Resolve Gradle dependencies
      - name: Resolve Gradle Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon dependencies

      # 14. Build Android APK
      - name: Build ARM64 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle --no-daemon --stacktrace clean assembleDebug

      # 15. Verify APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK generated successfully!"
          ls -lh "$APK"

      # 16. Upload APK
      - name: Upload Country Battle APK
        uses: actions/upload-artifact@v4
        with:
          name: country-battle-debug-apk-arm64
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
