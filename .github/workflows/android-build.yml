name: Country Battle Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Extract ZIP and Build ARM64 APK
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      GRADLE_VERSION: 8.9

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP and Find Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/_project"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_project"

          GRADLE_FILE=$(find "$GITHUB_WORKSPACE/_project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Licenses and Install Android Packages
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Node Mobile
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f scripts/setup-node-mobile.sh ]; then
            chmod +x scripts/setup-node-mobile.sh
            bash scripts/setup-node-mobile.sh
          fi

          if [ -f scripts/setup-node-deps.sh ]; then
            chmod +x scripts/setup-node-deps.sh
            bash scripts/setup-node-deps.sh
          fi

      - name: Validate ARM64 Library
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f app/libnode/bin/arm64-v8a/libnode.so || {
            echo "ERROR: ARM64 libnode.so missing!"
            exit 1
          }

          test -f app/libnode/include/node/node.h || {
            echo "ERROR: Node headers missing!"
            exit 1
          }

          echo "ARM64 library validation successful."

      - name: Create Native Library Packaging Fix
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/country-battle-packaging.init.gradle" <<'EOF'
          gradle.projectsEvaluated {
              allprojects { project ->
                  if (project.plugins.hasPlugin("com.android.application")) {
                      def androidExt = project.extensions.findByName("android")

                      if (androidExt != null) {
                          androidExt.packagingOptions.jniLibs.pickFirsts.add(
                              "lib/arm64-v8a/libc++_shared.so"
                          )

                          println "Country Battle FIX: pickFirst enabled for libc++_shared.so"
                      }
                  }
              }
          }
          EOF

          echo "Gradle packaging fix created."

      - name: Install Gradle Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon dependencies

      - name: Build Country Battle ARM64 APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --init-script "$RUNNER_TEMP/country-battle-packaging.init.gradle" \
            --stacktrace \
            clean assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated!"
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL!"
          ls -lh "$APK"

      - name: Upload Country Battle APK
        uses: actions/upload-artifact@v4
        with:
          name: Country-Battle-ARM64-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
