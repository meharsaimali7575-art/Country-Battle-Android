
name: Country Battle Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: ''

      - name: Install Android Packages
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          mkdir -p _project

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d _project

          SETTINGS_FILE=$(find _project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Setup Node Mobile Dependencies
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/scripts/setup-node-mobile.sh" ]; then
            chmod +x "$PROJECT_DIR/scripts/setup-node-mobile.sh"
            bash "$PROJECT_DIR/scripts/setup-node-mobile.sh"
          fi

          if [ -f "$PROJECT_DIR/scripts/setup-node-deps.sh" ]; then
            chmod +x "$PROJECT_DIR/scripts/setup-node-deps.sh"
            bash "$PROJECT_DIR/scripts/setup-node-deps.sh"
          fi

      - name: Download Official Node Mobile ARM64
        shell: bash
        run: |
          set -e

          VERSION="v18.20.4"
          API="https://api.github.com/repos/nodejs-mobile/nodejs-mobile/releases/tags/$VERSION"

          echo "Getting official Node Mobile release information..."

          curl -fL --retry 3 "$API" -o /tmp/node-release.json

          ASSET_URL=$(python3 - <<'PY'
          import json
          import sys

          data = json.load(open("/tmp/node-release.json"))
          assets = data.get("assets", [])

          matches = [
              a for a in assets
              if "android" in a["name"].lower()
              and a["name"].lower().endswith(".zip")
          ]

          if not matches:
              print("No Android ZIP asset found.", file=sys.stderr)
              print("Available assets:", file=sys.stderr)
              for a in assets:
                  print(a["name"], file=sys.stderr)
              sys.exit(1)

          if len(matches) > 1:
              print("Multiple Android ZIP assets found:", file=sys.stderr)
              for a in matches:
                  print(a["name"], file=sys.stderr)
              sys.exit(1)

          print(matches[0]["browser_download_url"])
          PY
          )

          echo "Downloading: $ASSET_URL"

          curl -fL --retry 3 "$ASSET_URL" \
            -o /tmp/node-mobile-android.zip

          mkdir -p /tmp/node-mobile-extracted
          unzip -q /tmp/node-mobile-android.zip \
            -d /tmp/node-mobile-extracted

          LIB=$(find /tmp/node-mobile-extracted -type f \
            -path '*/arm64-v8a/libnode.so' -print -quit)

          HEADER=$(find /tmp/node-mobile-extracted -type f \
            -path '*/node/node.h' -print -quit)

          if [ -z "$LIB" ] || [ -z "$HEADER" ]; then
            echo "ERROR: Required ARM64 library or Node headers missing."
            find /tmp/node-mobile-extracted -type f | head -100
            exit 1
          fi

          BIN_DIR="${LIB%/arm64-v8a/libnode.so}"
          INCLUDE_DIR="${HEADER%/node/node.h}"

          mkdir -p "$PROJECT_DIR/app/libnode/bin"
          mkdir -p "$PROJECT_DIR/app/libnode/include"

          cp -a "$BIN_DIR/." "$PROJECT_DIR/app/libnode/bin/"

          rm -rf "$PROJECT_DIR/app/libnode/include"
          mkdir -p "$PROJECT_DIR/app/libnode/include"

          cp -a "$INCLUDE_DIR/." \
            "$PROJECT_DIR/app/libnode/include/"

          test -f "$PROJECT_DIR/app/libnode/bin/arm64-v8a/libnode.so"
          test -f "$PROJECT_DIR/app/libnode/include/node/node.h"

          echo "Node Mobile ARM64 installed:"
          ls -lh "$PROJECT_DIR/app/libnode/bin/arm64-v8a/libnode.so"

      - name: Verify ARM64 Node Library
        shell: bash
        run: |
          set -e

          LIB="$PROJECT_DIR/app/libnode/bin/arm64-v8a/libnode.so"

          if [ ! -f "$LIB" ]; then
            echo "ERROR: ARM64 libnode.so is missing"
            exit 1
          fi

          file "$LIB"
          ls -lh "$LIB"

      - name: Fix Native Library Packaging
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          gradle_file = Path("app/build.gradle")

          if not gradle_file.exists():
              gradle_file = Path("app/build.gradle.kts")

          if not gradle_file.exists():
              print("ERROR: App Gradle file not found")
              sys.exit(1)

          content = gradle_file.read_text()

          if "libc++_shared.so" in content:
              print("Packaging rule already exists.")
              sys.exit(0)

          match = re.search(r'(?m)^([ \t]*)android\s*\{', content)

          if not match:
              print("ERROR: android { } block not found")
              sys.exit(1)

          indent = match.group(1) + "    "

          if gradle_file.suffix == ".kts":
              rule = (
                  "\n" + indent + "packaging {\n"
                  + indent + "    jniLibs {\n"
                  + indent + '        pickFirsts += "lib/arm64-v8a/libc++_shared.so"\n'
                  + indent + "    }\n"
                  + indent + "}\n"
              )
          else:
              rule = (
                  "\n" + indent + "packaging {\n"
                  + indent + "    jniLibs {\n"
                  + indent + "        pickFirsts += ['lib/arm64-v8a/libc++_shared.so']\n"
                  + indent + "    }\n"
                  + indent + "}\n"
              )

          position = match.end()
          gradle_file.write_text(
              content[:position] + rule + content[position:]
          )

          print("Native packaging rule added.")
          PY

      - name: Build Country Battle ARM64 APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload Country Battle APK
        uses: actions/upload-artifact@v4
        with:
          name: Country-Battle-ARM64-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
