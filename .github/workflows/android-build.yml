
name: Country Battle Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: ''

      - name: Install Android Packages
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          mkdir -p _project

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d _project

          SETTINGS_FILE=$(find _project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Setup Node Mobile Dependencies
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/scripts/setup-node-mobile.sh" ]; then
            chmod +x "$PROJECT_DIR/scripts/setup-node-mobile.sh"
            bash "$PROJECT_DIR/scripts/setup-node-mobile.sh"
          fi

          if [ -f "$PROJECT_DIR/scripts/setup-node-deps.sh" ]; then
            chmod +x "$PROJECT_DIR/scripts/setup-node-deps.sh"
            bash "$PROJECT_DIR/scripts/setup-node-deps.sh"
          fi

      - name: Download Official Node Mobile ARM64
        shell: bash
        run: |
          set -e

          VERSION="v18.20.4"
          API="https://api.github.com/repos/nodejs-mobile/nodejs-mobile/releases/tags/$VERSION"

          curl -fL --retry 3 "$API" -o /tmp/node-release.json

          ASSET_URL=$(python3 - <<'PY'
          import json
          import sys

          data = json.load(open("/tmp/node-release.json"))
          assets = data.get("assets", [])

          matches = [
              a for a in assets
              if "android" in a["name"].lower()
              and a["name"].lower().endswith(".zip")
          ]

          if not matches:
              print("Android ZIP asset not found", file=sys.stderr)
              for a in assets:
                  print(a["name"], file=sys.stderr)
              sys.exit(1)

          if len(matches) != 1:
              print("Multiple Android ZIP assets found", file=sys.stderr)
              for a in matches:
                  print(a["name"], file=sys.stderr)
              sys.exit(1)

          print(matches[0]["browser_download_url"])
          PY
          )

          curl -fL --retry 3 "$ASSET_URL" \
            -o /tmp/node-mobile-android.zip

          mkdir -p /tmp/node-mobile-extracted

          unzip -q /tmp/node-mobile-android.zip \
            -d /tmp/node-mobile-extracted

          LIB=$(find /tmp/node-mobile-extracted -type f \
            -path '*/arm64-v8a/libnode.so' -print -quit)

          HEADER=$(find /tmp/node-mobile-extracted -type f \
            -path '*/node/node.h' -print -quit)

          if [ -z "$LIB" ] || [ -z "$HEADER" ]; then
            echo "ERROR: ARM64 library or Node headers missing"
            find /tmp/node-mobile-extracted -type f | head -100
            exit 1
          fi

          BIN_DIR="${LIB%/arm64-v8a/libnode.so}"
          INCLUDE_DIR="${HEADER%/node/node.h}"

          mkdir -p "$PROJECT_DIR/app/libnode/bin"
          cp -a "$BIN_DIR/." "$PROJECT_DIR/app/libnode/bin/"

          rm -rf "$PROJECT_DIR/app/libnode/include"
          mkdir -p "$PROJECT_DIR/app/libnode/include"

          cp -a "$INCLUDE_DIR/." \
            "$PROJECT_DIR/app/libnode/include/"

          echo "Node Mobile ARM64 installed."

      - name: Verify ARM64 Node Library
        shell: bash
        run: |
          set -e

          LIB="$PROJECT_DIR/app/libnode/bin/arm64-v8a/libnode.so"

          if [ ! -f "$LIB" ]; then
            echo "ERROR: ARM64 libnode.so missing"
            exit 1
          fi

          ls -lh "$LIB"
          echo "ARM64 Node library verified."

      - name: Remove Duplicate C++ Runtime
        shell: bash
        run: |
          set -e

          echo "Searching app source for duplicate libc++_shared.so..."

          find "$PROJECT_DIR/app" \
            -type f \
            -name 'libc++_shared.so' \
            ! -path '*/build/*' \
            -print \
            -delete

          echo "Checking source folders..."

          REMAINING=$(find "$PROJECT_DIR/app" \
            -type f \
            -name 'libc++_shared.so' \
            ! -path '*/build/*' \
            -print)

          if [ -n "$REMAINING" ]; then
            echo "ERROR: Duplicate C++ runtime remains:"
            echo "$REMAINING"
            exit 1
          fi

          echo "Duplicate source runtime removed."
          echo "CMake will provide the native C++ runtime."

      - name: Build Country Battle ARM64 APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload Country Battle APK
        uses: actions/upload-artifact@v4
        with:
          name: Country-Battle-ARM64-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
