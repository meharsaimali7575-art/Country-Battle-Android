
name: Country Battle Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: country-battle-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: '27.2.12479018'
  GRADLE_VERSION: '8.9'

jobs:
  build-debug-apk:
    name: Extract ZIP and Build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Automatically Extract ZIP
      - name: Extract Android Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$(find . -maxdepth 1 \
            -type f -iname '*.zip' -print -quit)"

          if [[ -z "$ARCHIVE" ]]; then
            echo "ERROR: Project ZIP not found!"
            find . -maxdepth 2 -type f
            exit 1
          fi

          echo "Found ZIP: $ARCHIVE"

          mkdir -p "$GITHUB_WORKSPACE/_project"

          unzip -q "$ARCHIVE" \
            -d "$GITHUB_WORKSPACE/_project"

          SETTINGS_FILE="$(find \
            "$GITHUB_WORKSPACE/_project" \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"

          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/scripts/setup-node-mobile.sh"
          test -f "$PROJECT_DIR/scripts/setup-node-deps.sh"

          echo "Project extracted successfully!"

      # 3. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK without setup-android action
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo "ERROR: ANDROID_HOME not found!"
            exit 1
          fi

          SDKMANAGER="$(find \
            "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager \
            -print 2>/dev/null | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          "$SDKMANAGER" --version

          # Accept Android SDK licenses
          set +o pipefail
          yes | "$SDKMANAGER" --licenses \
            > /tmp/android-licenses.log 2>&1 || true
          set -o pipefail

          # Install required packages
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          echo "Android SDK configured successfully!"

      # 5. Configure NDK
      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

          test -d "$NDK_PATH"

          echo "ANDROID_NDK_HOME=$NDK_PATH" \
            >> "$GITHUB_ENV"

      # 6. Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 7. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 8. Node.js Mobile ARM64 Runtime
      - name: Download Node.js Mobile Runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup-node-mobile.sh

      # 9. Node.js Dependencies
      - name: Install Node.js Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup-node-deps.sh

      # 10. JavaScript Validation
      - name: Validate JavaScript
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          node --check \
            app/src/main/assets/nodejs-project/bootstrap.js

          node --check \
            app/src/main/assets/nodejs-project/server.js

          echo "JavaScript validation passed!"

      # 11. ARM64 Library Validation
      - name: Validate ARM64 Runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          LIB="app/libnode/bin/arm64-v8a/libnode.so"

          test -s "$LIB"
          test -s app/libnode/include/node/node.h

          file "$LIB"

          readelf -h "$LIB" \
            | grep -E 'Machine:.*AArch64'

          echo "ARM64 runtime verified!"

      # 12. Resolve Dependencies
      - name: Resolve Gradle Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon dependencies

      # 13. Build APK
      - name: Build Country Battle APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle --no-daemon \
            --stacktrace \
            clean assembleDebug

      # 14. Verify APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          ls -lh "$APK"

          echo "APK generated successfully!"

      # 15. Upload APK
      - name: Upload Country Battle APK
        uses: actions/upload-artifact@v4
        with:
          name: country-battle-debug-apk-arm64
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
