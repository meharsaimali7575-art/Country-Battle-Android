
name: Country Battle Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: country-battle-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: '27.2.12479018'
  GRADLE_VERSION: '8.9'
  SOURCE_ZIP: 'CountryBattle_Android_Updated_Source.zip'

jobs:
  build-debug-apk:
    name: Extract ZIP and Build ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Automatically extract Android project ZIP
      - name: Extract Android Project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$SOURCE_ZIP"

          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "ERROR: Project ZIP not found!"
            echo "Required filename: $SOURCE_ZIP"
            echo "ZIP files available:"
            find . -maxdepth 1 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/_extracted_project"

          unzip -q "$ZIP_PATH" \
            -d "$GITHUB_WORKSPACE/_extracted_project"

          SETTINGS_FILE=$(find \
            "$GITHUB_WORKSPACE/_extracted_project" \
            -type f -name settings.gradle \
            -print -quit)

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project extracted successfully!"
          echo "Project directory: $PROJECT_DIR"

          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/scripts/setup-node-mobile.sh"
          test -f "$PROJECT_DIR/scripts/setup-node-deps.sh"

      # 3. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install SDK, NDK and CMake
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      # 6. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 7. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # 8. Download ARM64 Node.js Mobile runtime
      - name: Setup Node.js Mobile ARM64
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          bash scripts/setup-node-mobile.sh

      # 9. Install bridge dependencies
      - name: Install Node.js Bridge Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          bash scripts/setup-node-deps.sh

      # 10. Validate JavaScript
      - name: Validate JavaScript
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          node --check \
            app/src/main/assets/nodejs-project/bootstrap.js

          node --check \
            app/src/main/assets/nodejs-project/server.js

          python3 - <<'PY'
          import re
          from pathlib import Path

          page = Path(
              'app/src/main/assets/nodejs-project/game/index.html'
          ).read_text(encoding='utf-8')

          scripts = re.findall(
              r'<script\b[^>]*>(.*?)</script>',
              page,
              flags=re.S | re.I
          )

          Path('/tmp/country-battle-inline.js').write_text(
              '\n'.join(scripts),
              encoding='utf-8'
          )
          PY

          node --check /tmp/country-battle-inline.js

      # 11. Verify ARM64 library
      - name: Verify ARM64 Node.js Runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -s app/libnode/bin/arm64-v8a/libnode.so
          test -s app/libnode/include/node/node.h

          readelf -h app/libnode/bin/arm64-v8a/libnode.so \
            | grep -q 'Machine:.*AArch64'

          echo "ARM64 runtime verified!"

      # 12. Build Android APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle --no-daemon --stacktrace clean assembleDebug

      # 13. Verify APK
      - name: Verify APK Output
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK successfully generated!"
          du -h "$APK"

      # 14. Upload APK to GitHub Artifacts
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: country-battle-debug-apk-arm64
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
