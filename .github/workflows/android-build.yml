
name: Country Battle Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: ''

      - name: Install Android Packages
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Android Project
        shell: bash
        run: |
          set -e
          mkdir -p _project

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d _project

          SETTINGS_FILE=$(find _project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Setup Node Mobile Dependencies
        working-directory: _project
        shell: bash
        run: |
          set -e

          if [ -f scripts/setup-node-mobile.sh ]; then
            chmod +x scripts/setup-node-mobile.sh
            bash scripts/setup-node-mobile.sh
          fi

          if [ -f scripts/setup-node-deps.sh ]; then
            chmod +x scripts/setup-node-deps.sh
            bash scripts/setup-node-deps.sh
          fi

      - name: Locate and Prepare ARM64 Node Library
        shell: bash
        run: |
          set -e

          TARGET="$PROJECT_DIR/app/libnode/bin/arm64-v8a/libnode.so"
          mkdir -p "$(dirname "$TARGET")"

          if [ -f "$TARGET" ]; then
            echo "ARM64 Node library already exists."
          else
            echo "Searching project for ARM64 libnode.so..."

            SOURCE=$(find "$PROJECT_DIR" -type f \
              -path '*/arm64-v8a/libnode.so' \
              -print -quit)

            if [ -z "$SOURCE" ]; then
              echo "ERROR: ARM64 libnode.so was not found."
              echo "Searching all libnode.so files:"
              find _project -type f -name 'libnode.so' -print || true

              echo "Searching libnode directories:"
              find _project -type d -iname '*libnode*' -print || true

              exit 1
            fi

            echo "Found: $SOURCE"
            cp "$SOURCE" "$TARGET"
          fi

          ls -lh "$TARGET"
          echo "ARM64 Node library is ready."

      - name: Fix Native Library Packaging
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          gradle_file = Path("app/build.gradle")

          if not gradle_file.exists():
              gradle_file = Path("app/build.gradle.kts")

          if not gradle_file.exists():
              print("ERROR: App Gradle file not found")
              sys.exit(1)

          content = gradle_file.read_text()

          if "libc++_shared.so" in content:
              print("Packaging rule already exists.")
              sys.exit(0)

          match = re.search(r'(?m)^([ \t]*)android\s*\{', content)

          if not match:
              print("ERROR: android { } block not found")
              sys.exit(1)

          indent = match.group(1) + "    "

          if gradle_file.suffix == ".kts":
              rule = (
                  "\n" + indent + "packaging {\n"
                  + indent + "    jniLibs {\n"
                  + indent + '        pickFirsts += "lib/arm64-v8a/libc++_shared.so"\n'
                  + indent + "    }\n"
                  + indent + "}\n"
              )
          else:
              rule = (
                  "\n" + indent + "packaging {\n"
                  + indent + "    jniLibs {\n"
                  + indent + "        pickFirsts += ['lib/arm64-v8a/libc++_shared.so']\n"
                  + indent + "    }\n"
                  + indent + "}\n"
              )

          position = match.end()
          gradle_file.write_text(content[:position] + rule + content[position:])

          print("Packaging rule added before Gradle build.")
          PY

      - name: Build Country Battle ARM64 APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          ls -lh "$APK"
          echo "APK successfully generated."

      - name: Upload Country Battle APK
        uses: actions/upload-artifact@v4
        with:
          name: Country-Battle-ARM64-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
